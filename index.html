<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jayasurya | Client Portfolio & Services</title>
  <meta name="description" content="Jayasurya portfolio with 20+ brand collaborations, client portfolio, services, cinema storytelling, and work approach." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    :root {
      --bg: #030a1a;
      --bg-2: #06122b;
      --panel: #0a1731;
      --panel-2: #0d1c39;
      --line: rgba(93, 124, 255, 0.24);
      --line-2: rgba(142, 97, 255, 0.32);
      --txt: #ecf3ff;
      --muted: #a9bad8;
      --muted-2: #7f95bb;
      --neon-blue: #4aa6ff;
      --neon-purple: #a864ff;
      --neon-cyan: #00e6d0;
      --success: #1de18a;
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      --glow: 0 0 0 1px rgba(94, 123, 255, 0.28), 0 0 34px rgba(84, 146, 255, 0.26);
      --font-main: 'Outfit', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    body {
      margin: 0;
      color: var(--txt);
      font-family: var(--font-main);
      background:
        radial-gradient(circle at 20% 0%, rgba(72, 120, 255, 0.18), transparent 22%),
        radial-gradient(circle at 80% 16%, rgba(168, 100, 255, 0.15), transparent 20%),
        radial-gradient(circle at 58% 72%, rgba(0, 230, 208, 0.09), transparent 18%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(167, 190, 255, 0.22) 0.8px, transparent 0.8px);
      background-size: 4px 4px;
      opacity: 0.05;
      z-index: -1;
    }

    body::after {
      content: '';
      position: fixed;
      inset: -25%;
      pointer-events: none;
      background: conic-gradient(from 0deg at 50% 50%, rgba(74, 166, 255, 0.08), rgba(168, 100, 255, 0.08), rgba(0, 230, 208, 0.05), rgba(74, 166, 255, 0.08));
      filter: blur(60px);
      animation: bgSpin 42s linear infinite;
      opacity: 0.75;
      z-index: -2;
    }

    .space-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
      opacity: 0.95;
    }

    .space-stars,
    .space-stars::before,
    .space-stars::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.9) 1px, transparent 1px),
        radial-gradient(rgba(165, 194, 255, 0.75) 1px, transparent 1px),
        radial-gradient(rgba(164, 109, 255, 0.7) 1px, transparent 1px);
      background-size: 86px 86px, 140px 140px, 210px 210px;
      background-position: 0 0, 24px 28px, 72px 64px;
      opacity: 0.28;
      animation: starDrift 90s linear infinite;
    }

    .space-stars::before {
      inset: -15%;
      background-size: 120px 120px, 180px 180px, 260px 260px;
      opacity: 0.16;
      animation-duration: 120s;
      animation-direction: reverse;
    }

    .space-stars::after {
      inset: -30%;
      background-size: 180px 180px, 240px 240px, 320px 320px;
      opacity: 0.12;
      animation-duration: 160s;
    }

    .space-orb,
    .space-wire {
      position: absolute;
      pointer-events: none;
      border: 1px solid rgba(129, 103, 255, 0.35);
      background: linear-gradient(135deg, rgba(95, 77, 220, 0.2), rgba(76, 130, 255, 0.08));
      box-shadow: 0 0 28px rgba(124, 87, 255, 0.16);
    }

    .space-orb.circle {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      top: 10%;
      right: 8%;
      animation: spaceFloat1 7.5s ease-in-out infinite;
    }

    .space-orb.square {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      left: 6%;
      top: 46%;
      animation: spaceFloat2 9s ease-in-out infinite;
    }

    .space-orb.pill {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      right: 22%;
      bottom: 18%;
      animation: spaceFloat3 8.2s ease-in-out infinite;
    }

    .space-wire {
      width: 110px;
      height: 110px;
      background: transparent;
      border-color: rgba(146, 84, 255, 0.42);
      clip-path: polygon(50% 0%, 87% 18%, 100% 50%, 87% 82%, 50% 100%, 13% 82%, 0% 50%, 13% 18%);
      opacity: 0.55;
      animation: wireRotate 18s linear infinite;
    }

    .space-wire.w1 { top: 24%; left: 38%; }
    .space-wire.w2 { bottom: 24%; left: 46%; width: 140px; height: 140px; animation-duration: 24s; }
    .space-wire.w3 { top: 68%; right: 30%; width: 96px; height: 96px; animation-duration: 20s; }

    .fx-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }

    .fx-orb {
      position: absolute;
      border-radius: 18px;
      border: 1px solid rgba(124, 157, 255, 0.34);
      background: radial-gradient(circle at 30% 30%, rgba(111, 171, 255, 0.3), rgba(111, 171, 255, 0.02));
      box-shadow: 0 0 24px rgba(101, 151, 255, 0.22);
      transform-style: preserve-3d;
    }

    .fx-orb.one {
      width: 90px;
      height: 90px;
      top: 18%;
      right: 8%;
      animation: floatOne 7.5s ease-in-out infinite;
    }

    .fx-orb.two {
      width: 58px;
      height: 58px;
      top: 43%;
      left: 6%;
      animation: floatTwo 9.2s ease-in-out infinite;
      border-radius: 14px;
    }

    .fx-orb.three {
      width: 72px;
      height: 72px;
      bottom: 9%;
      right: 22%;
      animation: floatThree 8.8s ease-in-out infinite;
      border-radius: 50%;
    }

    a { color: inherit; text-decoration: none; }
    .container { width: min(1180px, calc(100% - 2rem)); margin: 0 auto; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(2, 8, 22, 0.82);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(95, 129, 255, 0.2);
    }

    .topbar-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 14px 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
      box-shadow: 0 0 18px rgba(110, 140, 255, 0.55);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      animation: pulseGlow 3.4s ease-in-out infinite;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      color: var(--muted-2);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .nav a:hover { color: var(--neon-blue); }

    .menu-btn {
      display: none;
      border: 1px solid var(--line);
      background: rgba(18, 31, 66, 0.6);
      color: var(--txt);
      border-radius: 999px;
      padding: 0.58rem 0.9rem;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .mobile-panel { display: none; }

    section {
      padding: 64px 0;
      position: relative;
      isolation: isolate;
      perspective: 1600px;
      transform-style: preserve-3d;
      overflow: hidden;
    }

    section > .container {
      position: relative;
      z-index: 2;
      transform-style: preserve-3d;
    }

    section::before,
    section::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    section::before {
      background:
        radial-gradient(circle at 10% 18%, rgba(76, 126, 255, 0.11), transparent 18%),
        radial-gradient(circle at 88% 26%, rgba(164, 99, 255, 0.09), transparent 15%),
        radial-gradient(circle at 52% 78%, rgba(0, 230, 208, 0.06), transparent 16%);
      opacity: 0.9;
      transform: translateZ(-40px) scale(1.08);
    }

    section::after {
      background-image:
        linear-gradient(115deg, transparent 0 46%, rgba(120, 134, 255, 0.11) 48%, transparent 50%),
        linear-gradient(65deg, transparent 0 48%, rgba(169, 100, 255, 0.09) 50%, transparent 52%);
      background-size: 180px 180px, 240px 240px;
      opacity: 0.24;
      mix-blend-mode: screen;
      transform: translateZ(-28px);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 1rem;
      align-items: stretch;
    }

    .hero-left,
    .hero-right,
    .panel,
    .brand-card,
    .skill-card,
    .approach-card,
    .contact-card {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(14, 28, 59, 0.96), rgba(9, 20, 45, 0.96));
      border-radius: 18px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
    }

    .hero-left::before,
    .hero-right::before,
    .panel::before,
    .brand-card::before,
    .skill-card::before,
    .approach-card::before,
    .contact-card::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), transparent 30%, transparent 70%, rgba(157, 126, 255, 0.08));
      opacity: 0.68;
      transform: translateZ(1px);
    }

    .hero-left::after,
    .hero-right::after,
    .panel::after,
    .brand-card::after,
    .skill-card::after,
    .approach-card::after,
    .contact-card::after {
      content: '';
      position: absolute;
      inset: auto 12px 10px auto;
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: radial-gradient(circle, rgba(120, 134, 255, 0.14), transparent 72%);
      pointer-events: none;
      transform: translateZ(2px);
    }

    .hero-left:hover,
    .hero-right:hover,
    .panel:hover,
    .brand-card:hover,
    .skill-card:hover,
    .approach-card:hover,
    .contact-card:hover {
      transform: translateY(-8px) rotateX(7deg) rotateY(-8deg);
      box-shadow: 0 28px 48px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(113, 145, 255, 0.2), 0 0 36px rgba(96, 120, 255, 0.18);
      border-color: rgba(136, 163, 255, 0.56);
    }

    .tilt-card {
      transform-style: preserve-3d;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      will-change: transform;
    }

    .hero-left { padding: 2rem; position: relative; overflow: hidden; }

    .hero-left::after {
      content: '';
      position: absolute;
      right: -18%;
      top: -12%;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(95, 126, 255, 0.32), transparent 72%);
      pointer-events: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.34rem 0.7rem;
      color: var(--neon-blue);
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(17, 35, 74, 0.7);
      width: max-content;
    }

    .hero-title {
      margin: 1rem 0 0;
      font-size: clamp(2.6rem, 6vw, 4.6rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
      font-weight: 800;
    }

    .hero-title .gradient {
      background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 24px rgba(145, 112, 255, 0.22);
    }

    .hero-sub {
      margin: 0.55rem 0 0;
      font-size: 1.15rem;
      font-weight: 500;
      color: #d8e6ff;
    }

    .hero-copy {
      margin: 1rem 0 0;
      max-width: 62ch;
      color: var(--muted);
      line-height: 1.8;
      font-size: 0.98rem;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      margin-top: 1.35rem;
    }

    .button {
      min-height: 42px;
      padding: 0 1rem;
      border-radius: 12px;
      border: 1px solid var(--line);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .button:hover { transform: translateY(-1px); }

    .button-primary {
      background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
      border-color: transparent;
      box-shadow: 0 0 22px rgba(116, 136, 255, 0.4);
    }

    .button-secondary {
      background: rgba(17, 34, 70, 0.68);
      color: #d7e6ff;
    }

    .hero-right {
      padding: 1.1rem;
      display: grid;
      gap: 0.8rem;
      align-content: start;
    }

    .home-3d-zone {
      position: relative;
      perspective: 1100px;
      isolation: isolate;
    }

    .home-depth {
      position: absolute;
      pointer-events: none;
      border: 1px solid rgba(129, 178, 255, 0.34);
      background: linear-gradient(130deg, rgba(77, 153, 255, 0.2), rgba(121, 96, 255, 0.16));
      box-shadow: 0 10px 24px rgba(8, 16, 38, 0.45);
      z-index: 1;
      backdrop-filter: blur(4px);
    }

    .home-depth.depth-a {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      top: 14px;
      right: -36px;
      transform: rotate(14deg) translateZ(-20px);
      animation: depthFloatA 6.2s ease-in-out infinite;
    }

    .home-depth.depth-b {
      width: 86px;
      height: 86px;
      border-radius: 20px;
      bottom: 92px;
      left: -24px;
      transform: rotate(-11deg) translateZ(-16px);
      animation: depthFloatB 7.1s ease-in-out infinite;
    }

    .attachment-figure {
      position: absolute;
      top: 1rem;
      right: -0.5rem;
      width: 192px;
      height: 252px;
      pointer-events: none;
      z-index: 2;
      transform-style: preserve-3d;
      filter: drop-shadow(0 0 22px rgba(120, 102, 255, 0.28));
    }

    .attachment-figure::before {
      content: '';
      position: absolute;
      inset: 12px 8px 18px 8px;
      border-radius: 30px;
      background:
        radial-gradient(circle at 25% 20%, rgba(255, 120, 217, 0.28), transparent 26%),
        radial-gradient(circle at 78% 24%, rgba(83, 181, 255, 0.24), transparent 22%),
        radial-gradient(circle at 50% 78%, rgba(90, 255, 195, 0.14), transparent 26%),
        linear-gradient(135deg, rgba(34, 52, 109, 0.28), rgba(23, 23, 61, 0.1));
      border: 1px solid rgba(149, 120, 255, 0.35);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.05),
        0 0 36px rgba(108, 117, 255, 0.12);
      transform: rotate(-8deg) translateZ(4px);
    }

    .attachment-figure::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 54px;
      width: 122px;
      height: 122px;
      transform: translateX(-50%) rotate(-24deg);
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.05), transparent 60%);
      z-index: 5;
      animation: prismDrift 6.4s ease-in-out infinite;
    }

    .attachment-core {
      position: absolute;
      left: 50%;
      top: 22px;
      width: 132px;
      height: 132px;
      transform: translateX(-50%) rotate(12deg);
      border-radius: 34px;
      background:
        linear-gradient(145deg, rgba(109, 79, 255, 0.24), rgba(35, 214, 255, 0.12) 48%, rgba(255, 117, 209, 0.18) 100%),
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.32), transparent 18%),
        linear-gradient(180deg, rgba(8, 16, 42, 0.8), rgba(16, 23, 66, 0.92));
      border: 1px solid rgba(133, 142, 255, 0.6);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.05),
        0 18px 32px rgba(0, 0, 0, 0.28),
        inset 0 0 24px rgba(120, 99, 255, 0.18);
      animation: corePulse 5.2s ease-in-out infinite;
      z-index: 4;
    }

    .attachment-ring {
      position: absolute;
      left: 50%;
      top: 12px;
      width: 172px;
      height: 172px;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        conic-gradient(from 0deg, rgba(142, 102, 255, 0.0), rgba(110, 170, 255, 0.78), rgba(255, 110, 214, 0.82), rgba(78, 240, 193, 0.76), rgba(142, 102, 255, 0.0));
      -webkit-mask: radial-gradient(circle, transparent 56%, #000 57%);
      mask: radial-gradient(circle, transparent 56%, #000 57%);
      filter: blur(0.2px) drop-shadow(0 0 16px rgba(124, 95, 255, 0.28));
      animation: ringSpin 10s linear infinite;
      z-index: 3;
    }

    .attachment-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(0.2px) saturate(1.2);
      z-index: 2;
    }

    .attachment-orb.orb-one {
      width: 78px;
      height: 78px;
      left: 8px;
      top: 16px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 115, 214, 0.95), rgba(139, 83, 255, 0.18) 64%, transparent 70%);
      box-shadow: 0 0 24px rgba(255, 112, 216, 0.25);
      animation: orbFloatOne 4.8s ease-in-out infinite;
    }

    .attachment-orb.orb-two {
      width: 92px;
      height: 92px;
      right: 2px;
      bottom: 24px;
      background: radial-gradient(circle at 30% 30%, rgba(82, 194, 255, 0.92), rgba(64, 100, 255, 0.18) 66%, transparent 72%);
      box-shadow: 0 0 26px rgba(90, 170, 255, 0.24);
      animation: orbFloatTwo 5.6s ease-in-out infinite;
    }

    .mesh-section {
      padding: 72px 0;
      background:
        radial-gradient(circle at 50% 0%, rgba(83, 181, 255, 0.08), transparent 28%),
        radial-gradient(circle at 0% 50%, rgba(168, 100, 255, 0.06), transparent 24%),
        linear-gradient(180deg, var(--bg-2), var(--bg));
      position: relative;
      overflow: hidden;
      border-top: 1px solid rgba(93, 124, 255, 0.15);
      border-bottom: 1px solid rgba(93, 124, 255, 0.15);
    }

    .mesh-3d-container {
      position: absolute;
      pointer-events: none;
      filter: drop-shadow(0 0 24px rgba(110, 130, 255, 0.15));
    }

    .mesh-3d-container.mesh-size-large {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      aspect-ratio: 1;
      position: relative;
      filter: drop-shadow(0 0 32px rgba(110, 130, 255, 0.2));
    }

    .mesh-3d-container.mesh-size-medium {
      width: 280px;
      height: 280px;
      opacity: 0.6;
    }

    .mesh-3d-container.mesh-size-small {
      width: 180px;
      height: 180px;
      opacity: 0.5;
    }

    .mesh-3d-container.mesh-pos-center {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .mesh-3d-container.mesh-pos-top-right {
      top: 40px;
      right: 20px;
    }

    .mesh-3d-container.mesh-pos-bottom-left {
      bottom: 40px;
      left: 20px;
    }

    .mesh-3d-container.mesh-pos-top-left {
      top: 40px;
      left: 20px;
    }

    .mesh-3d-container.mesh-pos-bottom-right {
      bottom: 40px;
      right: 20px;
    }

    .mesh-3d-svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: saturate(1.15);
    }

    .mn-box {
      min-height: clamp(280px, 48vw, 560px);
      aspect-ratio: 4 / 5;
      border-radius: 16px;
      border: 1px solid rgba(129, 165, 255, 0.35);
      background: radial-gradient(circle at 20% 10%, rgba(85, 150, 255, 0.38), rgba(10, 22, 49, 0.88) 55%),
        linear-gradient(155deg, rgba(56, 143, 255, 0.42), rgba(114, 90, 255, 0.42));
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      animation: none;
      transform-style: preserve-3d;
      padding: 10px;
    }

    .mn-box::before,
    .mn-box::after {
      display: none;
    }

    .mn-box::before { width: 32px; height: 32px; left: -8px; bottom: 14px; }
    .mn-box::after { width: 28px; height: 28px; right: -7px; top: 14px; }

    .mn-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
      position: relative;
      z-index: 3;
      display: block;
      animation: none;
    }

    .profile-showcase {
      perspective: 1000px;
      box-shadow: 0 24px 46px rgba(5, 10, 24, 0.55), 0 0 34px rgba(99, 122, 255, 0.35);
      isolation: isolate;
    }

    .profile-showcase:hover {
      transform: translateY(-4px) rotateX(5deg) rotateY(-5deg);
      box-shadow: 0 30px 58px rgba(5, 10, 24, 0.62), 0 0 42px rgba(99, 122, 255, 0.42);
    }

    .profile-showcase::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: linear-gradient(120deg, transparent 18%, rgba(255, 255, 255, 0.14) 46%, transparent 74%);
      transform: none;
      animation: none;
      z-index: 4;
      pointer-events: none;
      opacity: 0.18;
    }

    .profile-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(215, 232, 255, 0.46);
      pointer-events: none;
      z-index: 2;
    }

    .profile-ring.ring-a {
      width: 104%;
      height: 104%;
      inset: -2%;
      border-color: rgba(104, 206, 255, 0.55);
      animation: none;
    }

    .profile-ring.ring-b {
      width: 84%;
      height: 84%;
      left: 8%;
      top: 8%;
      border-color: rgba(184, 131, 255, 0.5);
      animation: none;
    }

    .profile-image {
      filter: saturate(1.08) contrast(1.07);
      transform: translateZ(24px);
      box-shadow: inset 0 0 0 1px rgba(237, 245, 255, 0.2), 0 14px 28px rgba(0, 0, 0, 0.42);
      object-position: 50% 18%;
      animation: none;
    }

    .profile-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(214, 232, 255, 0.28);
      background: #08142d;
      transform: translateZ(16px);
      z-index: 3;
    }

    .profile-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(7, 16, 36, 0.05), rgba(7, 16, 36, 0.28));
      z-index: 4;
    }

    .profile-chip {
      position: absolute;
      z-index: 5;
      padding: 0.32rem 0.56rem;
      border-radius: 999px;
      border: 1px solid rgba(160, 203, 255, 0.45);
      background: rgba(10, 22, 48, 0.74);
      color: #daebff;
      font-family: var(--font-mono);
      font-size: 0.56rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      backdrop-filter: blur(3px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.28);
    }

    .profile-chip.chip-one {
      top: 14px;
      right: 14px;
      animation: none;
    }

    .profile-chip.chip-two {
      left: 14px;
      bottom: 16px;
      animation: none;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.7rem;
    }

    .stat {
      border: 1px solid var(--line);
      background: rgba(11, 23, 51, 0.92);
      border-radius: 12px;
      padding: 0.75rem;
    }

    .stat strong {
      font-size: 1.4rem;
      color: #dceaff;
      display: block;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 0.25rem;
      color: var(--muted-2);
      font-size: 0.72rem;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .section-head {
      margin-bottom: 1.4rem;
    }

    .section-label {
      color: var(--neon-blue);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .section-title {
      margin: 0;
      font-size: clamp(1.8rem, 3.7vw, 3.1rem);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .section-title em { color: var(--neon-purple); font-style: normal; }

    .section-copy {
      margin: 0.7rem 0 0;
      color: var(--muted);
      line-height: 1.8;
      max-width: 74ch;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .panel { padding: 1.2rem; }

    .quote {
      margin: 0 0 1rem;
      padding: 0.95rem 1rem;
      border-left: 2px solid var(--neon-blue);
      background: rgba(78, 132, 255, 0.12);
      border-radius: 0 10px 10px 0;
      color: #cfe1ff;
      line-height: 1.7;
    }

    .check-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 0.7rem;
    }

    .check-list li {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      color: var(--muted);
      line-height: 1.7;
    }

    .check-list li::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-top: 0.48rem;
      background: linear-gradient(135deg, var(--neon-blue), var(--neon-cyan));
      box-shadow: 0 0 10px rgba(74, 166, 255, 0.5);
      flex: 0 0 8px;
    }

    .brand-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.9rem;
    }

    .stack-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.9rem;
    }

    .brand-card {
      padding: 1.2rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      text-align: left;
    }

    .brand-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .brand-card h3 {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.2;
    }

    .brand-logo-wrap {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    .brand-logo {
      max-width: 100%;
      max-height: 56px;
      width: auto;
      height: auto;
      object-fit: contain;
      filter: brightness(1.1) drop-shadow(0 0 6px rgba(130, 170, 255, 0.25));
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .brand-card:hover .brand-logo {
      transform: scale(1.06);
      filter: brightness(1.2) drop-shadow(0 0 10px rgba(130, 170, 255, 0.4));
    }

    .exp-card,
    .edu-card,
    .strength-card,
    .tool-card {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(14, 28, 59, 0.96), rgba(9, 20, 45, 0.96));
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 1rem;
    }

    .exp-card h3,
    .edu-card h3,
    .strength-card h3,
    .tool-card h3 {
      margin: 0 0 0.45rem;
      font-size: 1.2rem;
    }

    .exp-card p,
    .edu-card p,
    .strength-card p,
    .tool-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 0.5rem;
      border-radius: 999px;
      border: 1px solid rgba(112, 148, 255, 0.35);
      background: rgba(28, 53, 106, 0.56);
      color: #c9dbff;
      font-family: var(--font-mono);
      font-size: 0.58rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 0.8rem;
      align-items: stretch;
    }

    .tool-pill {
      min-height: 54px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(19, 36, 73, 0.85);
      color: #d6e7ff;
      font-family: var(--font-mono);
      font-size: 0.64rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: transform 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease;
      animation: toolCardFloat 5.8s ease-in-out infinite;
    }

    .tool-pill:hover {
      transform: translateY(-6px) rotateX(10deg) rotateY(-10deg) scale(1.02);
      border-color: rgba(132, 178, 255, 0.62);
      box-shadow: 0 18px 26px rgba(5, 12, 30, 0.45), 0 0 18px rgba(90, 147, 255, 0.28);
    }

    .tool-pill:nth-child(2) { animation-delay: 0.3s; }
    .tool-pill:nth-child(3) { animation-delay: 0.6s; }
    .tool-pill:nth-child(4) { animation-delay: 0.9s; }
    .tool-pill:nth-child(5) { animation-delay: 1.2s; }
    .tool-pill:nth-child(6) { animation-delay: 1.5s; }

    .tool-pill img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 0 6px rgba(110, 160, 255, 0.35));
      animation: toolIconPulse 3.8s ease-in-out infinite;
    }

    .tool-pill span {
      line-height: 1;
      text-align: center;
    }

    .edu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.9rem;
    }

    .edu-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 0.65rem;
    }

    .edu-list li {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(18, 34, 70, 0.82);
      padding: 0.75rem;
      color: var(--muted);
      line-height: 1.65;
    }

    .strength-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.9rem;
    }

    .brand-card {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 180px;
      position: relative;
      overflow: hidden;
    }

    .brand-card::after {
      content: '';
      position: absolute;
      right: -18px;
      top: -18px;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 100, 255, 0.25), transparent 70%);
      pointer-events: none;
    }

    .brand-card h3 {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1;
      letter-spacing: -0.01em;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }

    .chip {
      padding: 0.28rem 0.5rem;
      border-radius: 999px;
      border: 1px solid rgba(112, 148, 255, 0.35);
      background: rgba(28, 53, 106, 0.56);
      color: #c9dbff;
      font-family: var(--font-mono);
      font-size: 0.58rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .highlight {
      box-shadow: var(--glow);
      border-color: rgba(122, 144, 255, 0.48);
    }

    .tilt-card {
      will-change: transform;
      transform-origin: center;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.9rem;
    }

    .skill-card {
      padding: 1rem;
      min-height: 170px;
    }

    .skill-icon {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: rgba(28, 53, 106, 0.64);
      display: grid;
      place-items: center;
      margin-bottom: 0.75rem;
      font-size: 1.1rem;
    }

    .skill-card h3 {
      margin: 0 0 0.45rem;
      font-size: 1.15rem;
    }

    .skill-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 0.95rem;
    }

    .approach-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.9rem;
    }

    .approach-card {
      padding: 1rem;
      position: relative;
    }

    .approach-num {
      color: var(--neon-cyan);
      font-family: var(--font-mono);
      font-size: 0.64rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.7rem;
    }

    .approach-card h3 {
      margin: 0 0 0.5rem;
      font-size: 1.2rem;
    }

    .approach-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .timeline {
      position: relative;
      padding-left: 1.3rem;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 0.3rem;
      top: 0.2rem;
      bottom: 0.2rem;
      width: 2px;
      background: linear-gradient(180deg, var(--neon-blue), var(--neon-purple));
      box-shadow: 0 0 14px rgba(94, 129, 255, 0.52);
    }

    .timeline p {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
      position: relative;
    }

    .timeline p + p { margin-top: 0.9rem; }

    .timeline p::before {
      content: '';
      position: absolute;
      left: -1.22rem;
      top: 0.45rem;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--neon-blue);
      box-shadow: 0 0 12px rgba(76, 170, 255, 0.75);
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.9rem;
    }

    .contact-card {
      padding: 1rem;
      display: flex;
      align-items: flex-start;
      gap: 0.8rem;
    }

    .contact-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      background: rgba(27, 50, 99, 0.56);
      font-family: var(--font-mono);
      font-size: 0.72rem;
    }

    .contact-label {
      color: var(--neon-blue);
      font-family: var(--font-mono);
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }

    .contact-value {
      color: var(--muted);
      line-height: 1.7;
      font-size: 0.95rem;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(106, 134, 255, 0.28), transparent);
    }

    footer {
      padding: 28px 0 36px;
      border-top: 1px solid rgba(93, 122, 255, 0.22);
      color: var(--muted-2);
      font-family: var(--font-mono);
      font-size: 0.64rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .reveal {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.65s ease, transform 0.65s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes bgSpin {
      from { transform: rotate(0deg) scale(1); }
      to { transform: rotate(360deg) scale(1.05); }
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 18px rgba(110, 140, 255, 0.45); }
      50% { box-shadow: 0 0 28px rgba(168, 100, 255, 0.65); }
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0px) rotateX(0deg); }
      50% { transform: translateY(-7px) rotateX(2deg); }
    }

    @keyframes profileDrift {
      0%, 100% { transform: scale(1) translateY(0px); }
      50% { transform: scale(1.02) translateY(-4px); }
    }

    @keyframes profileSheen {
      0%, 20% { transform: translateX(-125%); }
      45%, 100% { transform: translateX(125%); }
    }

    @keyframes ringSpin {
      from { transform: rotate(0deg) scale(1); }
      to { transform: rotate(360deg) scale(1.03); }
    }

    @keyframes ringSpinReverse {
      from { transform: rotate(360deg) scale(1); }
      to { transform: rotate(0deg) scale(0.98); }
    }

    @keyframes chipFloatOne {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(3px, -5px, 0); }
    }

    @keyframes chipFloatTwo {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(-3px, 4px, 0); }
    }

    @keyframes floatOne {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
      50% { transform: translate3d(-18px, 14px, 0) rotate(12deg); }
    }

    @keyframes floatTwo {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
      50% { transform: translate3d(12px, -16px, 0) rotate(-14deg); }
    }

    @keyframes floatThree {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(12px, -12px, 0) scale(1.08); }
    }

    @keyframes corePulse {
      0%, 100% { transform: translateX(-50%) rotate(12deg) translateY(0) scale(1); filter: saturate(1.15) hue-rotate(0deg); }
      50% { transform: translateX(-50%) rotate(10deg) translateY(-4px) scale(1.05); filter: saturate(1.35) hue-rotate(18deg); }
    }

    @keyframes orbFloatOne {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(10px, 8px, 0) scale(1.08); }
    }

    @keyframes orbFloatTwo {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-8px, -10px, 0) scale(1.06); }
    }

    @keyframes prismDrift {
      0%, 100% { transform: translateX(-50%) rotate(-24deg) translateY(0) scale(1); opacity: 0.55; }
      50% { transform: translateX(-50%) rotate(-14deg) translateY(-5px) scale(1.04); opacity: 0.85; }
    }

    .delay-1 { transition-delay: 0.08s; }
    .delay-2 { transition-delay: 0.16s; }

    #tools {
      padding-top: 52px;
      padding-bottom: 44px;
    }

    @media (max-width: 1024px) {
      .hero-grid,
      .grid-2,
      .brand-grid,
      .stack-grid,
      .edu-grid,
      .strength-grid,
      .tool-grid,
      .skills-grid,
      .approach-grid,
      .contact-grid {
        grid-template-columns: 1fr 1fr;
      }

      .hero-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 760px) {
      .container { width: min(100% - 1rem, 1180px); }
      .nav { display: none; }
      .menu-btn { display: inline-flex; }
      .mobile-panel { display: none; padding-bottom: 10px; }
      .mobile-panel.open { display: block; }
      .mobile-links {
        border: 1px solid var(--line);
        background: rgba(9, 21, 48, 0.98);
        border-radius: 12px;
        padding: 0.7rem;
        display: grid;
        gap: 0.65rem;
        font-family: var(--font-mono);
        font-size: 0.65rem;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }

      .brand-grid,
      .stack-grid,
      .edu-grid,
      .strength-grid,
      .tool-grid,
      .skills-grid,
      .approach-grid,
      .contact-grid,
      .grid-2,
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .hero-left,
      .hero-right,
      .panel,
      .brand-card,
      .skill-card,
      .approach-card,
      .contact-card { border-radius: 14px; }

      .home-depth { display: none; }

      .profile-chip { font-size: 0.52rem; }
      .profile-chip.chip-two { display: none; }
      .attachment-figure { right: -6px; top: 12px; transform: scale(0.78); transform-origin: top right; }

      .hero-title { font-size: clamp(2.2rem, 10vw, 3.4rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    @keyframes starDrift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-120px, 80px, 0); }
    }

    @keyframes spaceFloat1 {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
      50% { transform: translate3d(-10px, 12px, 0) rotate(8deg); }
    }

    @keyframes spaceFloat2 {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
      50% { transform: translate3d(12px, -12px, 0) rotate(-10deg); }
    }

    @keyframes spaceFloat3 {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(8px, -8px, 0) scale(1.06); }
    }

    @keyframes wireRotate {
      from { transform: rotate(0deg) translateZ(0); }
      to { transform: rotate(360deg) translateZ(0); }
    }

    @keyframes depthFloatA {
      0%, 100% { transform: rotate(14deg) translate3d(0, 0, 0) scale(1); }
      50% { transform: rotate(18deg) translate3d(-6px, 8px, 0) scale(1.04); }
    }

    @keyframes depthFloatB {
      0%, 100% { transform: rotate(-11deg) translate3d(0, 0, 0) scale(1); }
      50% { transform: rotate(-7deg) translate3d(6px, -7px, 0) scale(1.05); }
    }

    @keyframes toolCardFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    @keyframes toolIconPulse {
      0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 5px rgba(110, 160, 255, 0.3)); }
      50% { transform: translateY(-2px) scale(1.08); filter: drop-shadow(0 0 10px rgba(143, 177, 255, 0.5)); }
    }

    @media (max-width: 760px) {
      section { perspective: 900px; }
      section::after { background-size: 140px 140px, 190px 190px; opacity: 0.16; }
      .hero-left:hover,
      .hero-right:hover,
      .panel:hover,
      .brand-card:hover,
      .skill-card:hover,
      .approach-card:hover,
      .contact-card:hover {
        transform: translateY(-4px) rotateX(3deg) rotateY(-3deg);
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module" src="/main.jsx"></script>
